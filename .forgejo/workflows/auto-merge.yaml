name: Enable auto-merge

# pull_request_target (not pull_request): the automatic token for
# pull_request runs is read-only, since PR code could be untrusted. This
# workflow never checks out or runs anything from the PR itself -- it just
# calls the merge API using the workflow file from the base branch -- so
# pull_request_target is the safe way to get a write-capable token.
# https://forgejo.org/docs/latest/user/actions/security/
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

jobs:
  enable-auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Enable merge-when-checks-succeed
        run: |
          curl --fail -sS -X POST \
            -H "Authorization: token ${{ forgejo.token }}" \
            -H "Content-Type: application/json" \
            -d '{"Do": "merge", "merge_when_checks_succeed": true, "delete_branch_after_merge": true}' \
            "${{ forgejo.server_url }}/api/v1/repos/${{ forgejo.repository }}/pulls/${{ forgejo.event.pull_request.number }}/merge"
