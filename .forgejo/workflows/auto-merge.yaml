name: Enable auto-merge

# pull_request_target (not pull_request): the automatic token for
# pull_request runs is read-only, since PR code could be untrusted. This
# workflow never checks out or runs anything from the PR itself -- it just
# calls the merge API using the workflow file from the base branch -- so
# pull_request_target is the safe way to get a write-capable token.
# https://forgejo.org/docs/latest/user/actions/security/
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

# Step 1: Enable JWT generation:
enable-openid-connect: true

jobs:
  enable-auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: fetch jwt
        id: jwt
        env:
          # Step 2: Use the "Audience" value; in this example it
          # is separated out from the small script below,
          # but it can be placed inline as well.
          # Safe to commit to public code -- not confidential.
          AUD: u:1:5b0b6d5e-23e7-47d2-a274-1ecb6d54c100
        # Step 2: HTTP request to Forgejo. This script uses `curl`
        # and `jq` and assumes they are available, but any HTTP
        # client can be used.
        run: |
          jwt=$( \
            curl --fail \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUD" \
            | jq -r ".value" \
          )
          # ::add-mask:: tells Forgejo Runner that the JWT
          # is a secret which should be masked in the logs.
          echo "::add-mask::$jwt"
          echo "jwt=$jwt" >> $FORGEJO_OUTPUT
      # Step 3: Example here adds a new comment to an issue when it
      # is labeled.  `curl` and `jq` are used again to make a simple
      # HTTP request with bearer token authorization.
      - name: Enable merge-when-checks-succeed
        run: |
          curl --fail -sS -X POST \
            -H "Authorization: token ${{ steps.jwt.outputs.jwt }}" \
            -H "Content-Type: application/json" \
            -d '{"Do": "merge", "merge_when_checks_succeed": true, "delete_branch_after_merge": true}' \
            "${{ forgejo.server_url }}/api/v1/repos/${{ forgejo.repository }}/pulls/${{ forgejo.event.pull_request.number }}/merge"
